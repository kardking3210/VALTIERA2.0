services:
  - type: web
    name: valtiera-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: VALTIERA_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: WORKER_POLL_SECONDS
        value: "2"

  - type: worker
    name: valtiera-research-worker
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m app.worker
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: WORKER_POLL_SECONDS
        value: "2"
