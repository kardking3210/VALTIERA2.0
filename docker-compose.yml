services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: valtiera
      POSTGRES_USER: valtiera
      POSTGRES_PASSWORD: change-me
    ports: ["5432:5432"]
    volumes: ["valtiera_pg:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  valtiera_pg:
